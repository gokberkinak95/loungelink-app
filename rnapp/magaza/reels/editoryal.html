<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<!-- Editoryal illustrasyon gonderileri ONIZLEME (11 Kasim 2026). ?p=1|2|3 (tekil) · k0..k6 (kaydirmali: kapak, 01-05, kapanis)
     Cizimler elle yazilmis katmanli SVG: duz sekiller, yumusak gradyan, kagit grenı; isik hep sagdan/pencereden. Marka/logo yok. -->
<style>
@font-face{font-family:J;src:url(jakarta-semibold.woff2)}
@font-face{font-family:JR;src:url(jakarta-regular.woff2)}
html,body{margin:0;padding:0;background:#000}
#p{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:J;color:#13213C;background:#F5EFE3}
.k{position:absolute;left:0;top:0}
#bas{position:absolute;left:64px;top:150px;width:952px}
#bas h1{margin:0;font-weight:normal;font-size:88px;line-height:1.0;letter-spacing:-.025em;white-space:nowrap}
#bas .cubuk{width:118px;height:12px;border-radius:6px;background:#C9A25E;margin-top:30px}
#bas .alt{margin-top:28px;font-family:JR;font-size:32px;line-height:1.36;color:#3A4A66;max-width:820px}
</style></head><body>
<div id="p"></div>
<script src="veri.js"></script>
<script>
const P = new URLSearchParams(location.search).get("p") || "1";
const $ = (i) => document.getElementById(i);
// ------------------------------------------------------------------ RENK
const R = { lac: "#13213C", lac2: "#22365F", lac3: "#2E4573", arduaz: "#41557E", gok1: "#6E93C8", gok2: "#A9C0E0", gok3: "#DCE6F2",
  seftali: "#F3D7BE", krem: "#FBEADB", fil: "#F5EFE3", altin: "#C9A25E", altin2: "#E7D3AC", kiremit: "#C2745A", ada: "#8FB7A5", ada2: "#5E8C74",
  karamel: "#B9814F", ceviz: "#8A5A3B" };
function ton(hex, a) {   // a<0 koyulaştır, a>0 açıklaştır
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = (c) => Math.round(a < 0 ? c * (1 + a) : c + (255 - c) * a);
  return "#" + [f(r), f(g), f(b)].map(c => Math.max(0, Math.min(255, c)).toString(16).padStart(2, "0")).join("");
}
const TEN = ["#F2C9A8", "#E0A884", "#B97B57", "#7A4B33", "#5A3626"];
const kanat = (renk, w) => `<svg width="${w}" height="${w * 29 / 62}" viewBox="76 117.5 62 29"><path d="${VERI.kanat}" fill="${renk}"/></svg>`;
const cizgi = (d, renk, w) => `<path d="${d}" fill="none" stroke="${renk}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;

// ------------------------------------------------------------------ İNSANLAR (sağa bakar; yon=-1 aynalar)
function bas(o, hx, hy) {
  const s = o.sac || "#2A1E1A", t = o.ten;
  let arka = "", on = "";
  switch (o.stil) {
    case "kisa": on = `<path d="M-22,-2 C-25,-22 -10,-31 6,-30 C19,-29 26,-20 23,-9 C14,-14 4,-15 -2,-9 L-5,8 C-14,11 -21,6 -22,-2Z" fill="${s}"/>`; break;
    case "topuz": on = `<circle cx="-19" cy="-19" r="11.5" fill="${s}"/><path d="M-22,4 C-27,-20 -8,-32 8,-30 C20,-28 26,-18 23,-9 C12,-15 1,-14 -4,-6 L-6,12 C-16,15 -22,11 -22,4Z" fill="${s}"/>`; break;
    case "uzun": arka = `<path d="M-20,-6 C-30,10 -30,40 -22,58 L4,56 C0,40 -2,20 0,4Z" fill="${s}"/>`;
      on = `<path d="M-22,2 C-27,-21 -8,-32 8,-30 C20,-28 26,-18 23,-9 C12,-15 2,-14 -2,-6 L-2,20 C-12,24 -22,14 -22,2Z" fill="${s}"/>`; break;
    case "kivircik": on = [[-15, -17, 13], [0, -24, 13], [14, -22, 10], [-21, -1, 12], [-17, 13, 10], [-6, -12, 9]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${s}"/>`).join(""); break;
    case "kel": on = `<path d="M-21,-4 C-22,-14 -16,-20 -8,-22 C-14,-12 -14,-2 -10,8 C-16,8 -21,4 -21,-4Z" fill="${s}"/>`; break;
    case "ortu": on = `<path d="M14,-22 C4,-33 -16,-31 -24,-16 C-31,-2 -28,22 -22,36 C-16,50 0,58 22,58 L30,50 C20,44 14,34 12,22 C10,10 10,-4 14,-22Z" fill="${s}"/><path d="M13,-21 C18,-26 24,-22 24,-14 L22,-8 C18,-14 15,-16 13,-21Z" fill="${s}"/>`; break;
  }
  const kulak = (o.stil === "ortu" || o.stil === "uzun") ? "" : `<ellipse cx="-3" cy="2" rx="4.5" ry="6.5" fill="${ton(t, -.12)}"/>`;
  const sakal = o.sakal ? `<path d="M2,8 C4,22 16,28 24,14 L23,6 C16,12 8,12 2,8Z" fill="${o.sakal}"/>` : "";
  const gozluk = o.gozluk ? `<path d="M12,-6 L24,-6" stroke="${R.lac}" stroke-width="2.4"/><rect x="13" y="-9" width="9" height="7" rx="2" fill="none" stroke="${R.lac}" stroke-width="2"/>` : "";
  return `<g transform="translate(${hx},${hy}) rotate(${o.egik || 0})">${arka}<ellipse cx="2" cy="0" rx="21" ry="25" fill="${t}"/>
    <path d="M21,-6 Q28,1 21,7Z" fill="${t}"/>${sakal}${on}${kulak}${gozluk}
    <path d="M-12,-2 C-10,10 2,24 20,20 C10,26 -6,22 -12,8Z" fill="${ton(t, -.08)}" opacity=".5"/></g>`;
}
function ayakta(o) {
  const t = o.ten, ust = o.ust, alt = o.alt, ay = o.ayk || "#1E2230", yuru = o.poz === "yuru" || o.poz === "bavul";
  const bacakA = yuru ? "M-4,-165 L-26,-10" : "M-4,-165 L-12,-8", bacakO = yuru ? "M8,-165 L32,-10" : "M8,-165 L20,-8";
  let s = "";
  if (o.sirt) s += `<rect x="-56" y="-286" width="34" height="104" rx="12" fill="${o.sirt}"/><rect x="-50" y="-240" width="22" height="34" rx="6" fill="${ton(o.sirt, -.15)}"/>`;
  s += cizgi(bacakA, ton(alt, -.18), 30) + cizgi(bacakO, alt, 31);
  const aA = yuru ? [-26, -10] : [-12, -8], aO = yuru ? [32, -10] : [20, -8];
  s += `<ellipse cx="${aA[0] + 7}" cy="${aA[1] + 4}" rx="19" ry="8" fill="${ton(ay, -.1)}"/><ellipse cx="${aO[0] + 8}" cy="${aO[1] + 4}" rx="19" ry="8" fill="${ay}"/>`;
  // arka kol
  s += cizgi(o.poz === "yuru" ? "M0,-284 L-20,-226 L-30,-176" : "M0,-284 L-12,-222 L-10,-170", ton(ust, -.2), 21);
  const boy = o.uzunManto ? -96 : -158;
  s += `<path d="M-31,${boy} C-35,-215 -33,-262 -19,-292 Q2,-303 25,-292 C39,-262 41,-215 ${o.uzunManto ? 40 : 35},${boy} Z" fill="${ust}"/>`;
  s += `<path d="M-31,${boy} C-35,-215 -33,-262 -19,-292 Q-8,-298 -2,-296 C-10,-250 -8,-200 -4,${boy}Z" fill="${ton(ust, -.14)}" opacity=".55"/>`;
  if (o.yaka) s += `<path d="M-4,-296 L10,-262 L22,-294Z" fill="${o.yaka}"/>`;
  if (o.sirt) s += cizgi("M-14,-292 L-28,-250", ton(o.sirt, -.25), 7);
  s += `<rect x="-6" y="-314" width="16" height="26" rx="5" fill="${ton(t, -.06)}"/>`;
  // ön kol
  const kol = { dur: "M8,-284 L18,-222 L22,-168", yuru: "M8,-284 L30,-228 L44,-184", telefon: "M8,-284 L28,-232 L36,-266",
    bavul: "M8,-284 L24,-226 L40,-176", uzat: "M8,-284 L42,-246 L82,-246", buyutec: "M8,-284 L46,-266 L72,-296", selam: "M8,-284 L40,-250 L76,-262" }[o.poz || "dur"];
  const el = kol.split("L").pop().split(",").map(Number);
  if (o.poz === "bavul") {
    const b = o.bavulRenk || R.lac2;
    s += cizgi(`M${el[0] + 2},${el[1]} L${el[0] + 26},${el[1] + 72}`, "#4A4F5C", 5) + `<g transform="translate(${el[0] + 20},${el[1] + 66}) rotate(14)">
      <rect x="0" y="0" width="72" height="104" rx="12" fill="${b}"/><rect x="0" y="0" width="72" height="104" rx="12" fill="url(#bavulIsik)"/>
      <path d="M18,8 L18,96 M54,8 L54,96" stroke="${ton(b, -.2)}" stroke-width="4"/><circle cx="12" cy="110" r="7" fill="#1E2230"/><circle cx="60" cy="110" r="7" fill="#1E2230"/></g>`;
  }
  s += cizgi(kol, ust, 22) + `<circle cx="${el[0]}" cy="${el[1]}" r="9.5" fill="${t}"/>`;
  if (o.poz === "telefon") s += `<rect x="${el[0] - 2}" y="${el[1] - 26}" width="14" height="24" rx="3" fill="${R.lac}"/>`;
  if (o.poz === "uzat") s += `<g transform="translate(${el[0] + 4},${el[1] - 20}) rotate(-8)"><rect width="60" height="28" rx="3" fill="${R.fil}"/><rect width="16" height="28" fill="${R.lac2}"/><rect x="22" y="9" width="30" height="4" rx="2" fill="${R.arduaz}"/><rect x="22" y="17" width="20" height="3" rx="1.5" fill="${R.altin}"/></g>`;
  if (o.poz === "buyutec") s += `<g transform="translate(${el[0]},${el[1]})">${cizgi("M0,0 L22,-26", R.ceviz, 9)}<circle cx="44" cy="-52" r="34" fill="rgba(220,235,245,.35)" stroke="${R.altin}" stroke-width="7"/><path d="M28,-70 Q40,-78 54,-72" stroke="#fff" stroke-width="4" fill="none" opacity=".7"/></g>`;
  s += bas(o, 4, -336);
  return `<g transform="translate(${o.x},${o.y}) scale(${(o.s || 1) * (o.yon || 1)},${o.s || 1})">${s}</g>`;
}
function oturan(o) {   // kalça (0,0), oturma yüzeyi y=0
  const t = o.ten, ust = o.ust, alt = o.alt, ay = o.ayk || "#1E2230";
  let s = "";
  if (o.bacak === "capraz") {
    s += cizgi("M0,-6 L92,-10 L104,98", ton(alt, -.18), 30) + `<ellipse cx="116" cy="102" rx="18" ry="8" fill="${ton(ay, -.1)}"/>`;
    s += cizgi("M6,-4 L96,-24 L150,46", alt, 32) + `<ellipse cx="160" cy="52" rx="18" ry="8" transform="rotate(40 160 52)" fill="${ay}"/>`;
  } else {
    s += cizgi("M0,-6 L92,-10 L106,98", ton(alt, -.18), 30) + `<ellipse cx="118" cy="102" rx="18" ry="8" fill="${ton(ay, -.1)}"/>`;
    s += cizgi("M6,2 L98,-2 L96,106", alt, 32) + `<ellipse cx="108" cy="110" rx="19" ry="8" fill="${ay}"/>`;
  }
  const lean = o.egim || 0;
  let g = "";
  g += cizgi("M2,-136 L-4,-78 L22,-56", ton(ust, -.2), 20);
  g += `<path d="M-31,4 C-37,-52 -35,-108 -18,-146 Q4,-157 25,-146 C38,-112 40,-55 33,4Z" fill="${ust}"/>`;
  g += `<path d="M-31,4 C-37,-52 -35,-108 -18,-146 Q-8,-152 -2,-150 C-12,-100 -10,-50 -4,4Z" fill="${ton(ust, -.14)}" opacity=".55"/>`;
  if (o.yaka) g += `<path d="M-2,-150 L10,-118 L22,-148Z" fill="${o.yaka}"/>`;
  if (o.atki) g += `<path d="M-14,-150 C-4,-136 16,-136 26,-150 L22,-124 C14,-116 2,-116 -8,-122Z" fill="${o.atki}"/>`;
  g += `<rect x="-5" y="-170" width="16" height="26" rx="5" fill="${ton(t, -.06)}"/>`;
  const kol = { fincan: "M10,-138 L30,-78 L62,-98", konus: "M10,-138 L38,-86 L74,-124", dinlen: "M10,-138 L30,-76 L70,-62",
    kitap: "M10,-138 L34,-82 L66,-92", telefon: "M10,-138 L32,-80 L58,-110" }[o.poz || "dinlen"];
  const el = kol.split("L").pop().split(",").map(Number);
  if (o.poz === "kitap") g += `<g transform="translate(${el[0] - 8},${el[1] - 34}) rotate(-14)"><rect width="46" height="34" rx="3" fill="${o.kitapRenk || R.kiremit}"/><rect x="4" y="3" width="38" height="28" rx="2" fill="${R.fil}"/><path d="M23,3 L23,31" stroke="${ton(R.fil, -.15)}" stroke-width="2"/></g>`;
  g += cizgi(kol, ust, 21) + `<circle cx="${el[0]}" cy="${el[1]}" r="9.5" fill="${t}"/>`;
  if (o.poz === "fincan") g += `<path d="M${el[0] - 8},${el[1] - 22} L${el[0] + 12},${el[1] - 22} L${el[0] + 10},${el[1] - 2} L${el[0] - 6},${el[1] - 2}Z" fill="${R.fil}"/><path d="M${el[0] + 11},${el[1] - 18} q8,2 6,9 q-2,4 -7,3" fill="none" stroke="${R.fil}" stroke-width="3"/>`;
  if (o.poz === "konus") g += `<ellipse cx="${el[0] + 6}" cy="${el[1] - 8}" rx="8" ry="12" transform="rotate(20 ${el[0] + 6} ${el[1] - 8})" fill="${t}"/>`;
  if (o.poz === "telefon") g += `<rect x="${el[0] - 4}" y="${el[1] - 26}" width="14" height="24" rx="3" fill="${R.lac}"/>`;
  g += bas(o, 6, -190);
  s += `<g transform="rotate(${lean})">${g}</g>`;
  return `<g transform="translate(${o.x},${o.y}) scale(${(o.s || 1) * (o.yon || 1)},${o.s || 1})">${s}</g>`;
}
// ------------------------------------------------------------------ EŞYALAR
function koltuk(x, y, s, renk, yon = 1, onKol = true) {   // kişinin kalçası (x,y); sağa bakan
  const k = ton(renk, -.18), a = ton(renk, .12);
  const arka = `<g transform="translate(${x},${y}) scale(${s * yon},${s})"><ellipse cx="30" cy="96" rx="96" ry="10" fill="rgba(19,33,60,.16)"/>
    <rect x="-34" y="60" width="6" height="34" fill="${R.altin}"/><rect x="92" y="60" width="6" height="34" fill="${R.altin}"/>
    <rect x="-64" y="-150" width="46" height="196" rx="22" fill="${k}" transform="rotate(-9 -40 40)"/>
    <rect x="-50" y="-4" width="160" height="66" rx="22" fill="${renk}"/><rect x="-50" y="-4" width="160" height="18" rx="9" fill="${a}" opacity=".6"/></g>`;
  const on = onKol ? `<g transform="translate(${x},${y}) scale(${s * yon},${s})"><rect x="-58" y="-48" width="132" height="40" rx="20" fill="${ton(renk, -.06)}"/><rect x="-58" y="-48" width="132" height="12" rx="6" fill="${a}" opacity=".5"/>
    <rect x="-58" y="-30" width="34" height="90" rx="14" fill="${ton(renk, -.06)}"/></g>` : "";
  return { arka, on };
}
function sehpa(x, y, s, ust = "#EDE6DA") {
  return `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="150" rx="64" ry="9" fill="rgba(19,33,60,.16)"/><rect x="-5" y="0" width="10" height="146" fill="${R.lac2}"/>
    <ellipse cx="0" cy="146" rx="40" ry="8" fill="${R.lac2}"/><ellipse cx="0" cy="6" rx="86" ry="18" fill="${ton(ust, -.14)}"/><ellipse cx="0" cy="0" rx="86" ry="18" fill="${ust}"/></g>`;
}
function fincan(x, y, s = 1, renk = "#FFFFFF") {
  return `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="0" rx="22" ry="5" fill="${ton(renk, -.12)}"/><path d="M-13,-2 L13,-2 L11,-24 L-11,-24Z" fill="${renk}"/>
    <ellipse cx="0" cy="-24" rx="11" ry="3" fill="#6B4430"/><path d="M12,-20 q9,1 7,9 q-2,5 -9,3" fill="none" stroke="${renk}" stroke-width="3"/></g>`;
}
function bitki(x, y, s, saksi = R.lac2) {
  const y1 = [[-40, -150, -30], [30, -170, 25], [-10, -210, -5], [55, -120, 50], [-60, -110, -55], [15, -120, 10]];
  return `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="4" rx="50" ry="8" fill="rgba(19,33,60,.16)"/>` +
    y1.map(([dx, dy, r], i) => `${cizgi(`M0,-60 Q${dx * .4},${dy * .5} ${dx},${dy}`, R.ada2, 4)}<ellipse cx="${dx}" cy="${dy}" rx="20" ry="44" transform="rotate(${r} ${dx} ${dy})" fill="${i % 2 ? R.ada : R.ada2}"/>`).join("") +
    `<path d="M-38,-70 L38,-70 L30,0 L-30,0Z" fill="${saksi}"/><rect x="-42" y="-76" width="84" height="12" rx="4" fill="${ton(saksi, .1)}"/></g>`;
}
function lamba(x, y, s) {
  return `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="2" rx="36" ry="7" fill="rgba(19,33,60,.16)"/><rect x="-26" y="-6" width="52" height="8" rx="4" fill="${R.lac2}"/>
    ${cizgi("M0,-4 L0,-300 Q0,-340 60,-344", R.lac2, 6)}<path d="M36,-340 L90,-340 L104,-300 L22,-300Z" fill="${R.altin}"/>
    <ellipse cx="63" cy="-300" rx="41" ry="7" fill="#FFF3D6"/><path d="M22,-300 L104,-300 L170,-60 L-40,-60Z" fill="url(#lambaIsik)" opacity=".55"/></g>`;
}
function ucak(x, y, s, gece = false, yon = 1) {   // burun solda (yon=1)
  const g = gece ? "#3B4A6A" : "#F4F1EA", gol = gece ? "#2A3754" : "#D9D3C7", kuy = gece ? "#1A2440" : R.lac2, cam = gece ? "#F7D98A" : R.lac2;
  let w = ""; for (let i = 0; i < 26; i++) w += `<rect x="${118 + i * 15}" y="-27" width="7" height="9" rx="3" fill="${cam}" opacity="${gece ? .85 : .7}"/>`;
  return `<g transform="translate(${x},${y}) scale(${s * yon},${s})">
    <ellipse cx="320" cy="62" rx="300" ry="12" fill="rgba(19,33,60,${gece ? .3 : .12})"/>
    <path d="M300,-6 L420,58 L470,58 L360,-6Z" fill="${gece ? "#25314D" : "#BDB6AA"}"/>
    <rect x="96" y="6" width="5" height="44" fill="#5A5F6B"/><rect x="380" y="10" width="6" height="40" fill="#5A5F6B"/><rect x="430" y="10" width="6" height="40" fill="#5A5F6B"/>
    <circle cx="98" cy="52" r="8" fill="#22252E"/><circle cx="383" cy="52" r="9" fill="#22252E"/><circle cx="433" cy="52" r="9" fill="#22252E"/>
    <path d="M0,2 C0,-24 34,-44 92,-46 L560,-46 C590,-46 612,-62 632,-104 L668,-104 L650,-40 C644,-8 624,6 582,8 L80,12 C30,12 0,10 0,2Z" fill="${g}"/>
    <path d="M6,6 C40,12 70,12 90,12 L582,8 C620,6 640,-6 648,-30 L652,-26 C646,0 626,14 584,16 L80,20 C36,20 8,14 6,6Z" fill="${gol}"/>
    <path d="M574,-46 L632,-160 L676,-160 L650,-46Z" fill="${kuy}"/><path d="M600,-50 L700,-62 L700,-50 L606,-36Z" fill="${kuy}"/>
    <path d="M18,-14 C24,-24 36,-30 50,-31 L52,-20 C40,-20 28,-18 18,-14Z" fill="${gece ? "#F7D98A" : R.lac}"/>${w}
    <path d="M260,-2 L330,62 L392,62 L352,-2Z" fill="${gece ? "#2F3C5C" : "#CFC8BC"}"/>
    <rect x="300" y="22" width="92" height="34" rx="16" fill="${gece ? "#24304A" : "#B9B2A6"}"/><ellipse cx="300" cy="39" rx="8" ry="16" fill="${gece ? "#151C2E" : "#7D776D"}"/>
    ${gece ? `<circle cx="652" cy="-160" r="5" fill="#FF6B5A"/><circle cx="652" cy="-160" r="14" fill="#FF6B5A" opacity=".3"/><circle cx="390" cy="62" r="5" fill="#7CF0B0"/><circle cx="390" cy="62" r="16" fill="#7CF0B0" opacity=".25"/>` : ""}</g>`;
}
function bulut(x, y, rx, ry, o) { return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#fff" opacity="${o}" filter="url(#yumusak)"/>`; }
// pencere: dışarı (gök + apron + uçak) ve kayıtlar
function disari(x, y, w, h, gece, ic) {
  const ufuk = y + h * .7;
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#${gece ? "gokGece" : "gokGun"})"/>`;
  if (!gece) s += `<circle cx="${x + w * .72}" cy="${ufuk - 30}" r="${h * .55}" fill="url(#gunes)"/>` + bulut(x + w * .2, y + h * .3, 160, 22, .55) + bulut(x + w * .75, y + h * .18, 120, 16, .4) + bulut(x + w * .5, ufuk - 40, 260, 24, .6);
  else { let st = ""; for (let i = 0; i < 40; i++) st += `<circle cx="${x + rnd(i) * w}" cy="${y + rnd(i + 99) * h * .55}" r="${1 + rnd(i + 7) * 1.6}" fill="#fff" opacity="${.35 + rnd(i + 3) * .5}"/>`;
    s += st + `<circle cx="${x + w * .8}" cy="${y + h * .2}" r="30" fill="#F6E7C2"/><circle cx="${x + w * .8 + 12}" cy="${y + h * .2 - 8}" r="28" fill="#1A2B4C"/>`; }
  // uzak terminal / kule
