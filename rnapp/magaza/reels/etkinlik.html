<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<!-- App Store uygulama ici etkinlik gorselleri ONIZLEME (10 Kasim 2026) - etkinlik adi "Kurucu Host ol".
     ?b=kart -> 1920x1080 (etkinlik karti; Apple sol alta ad + aciklama bindirir, orasi bos)
     ?b=detay -> 1080x1920 (ayrinti sayfasi; alt bolume Apple metni biner, ana icerik ustte)
     Etkinlik adi gorselde tekrarlanmaz; fiyat / ucretsiz iddiasi yok. Rozet ek hak/oncelik saglamaz: oncelik ima edilmez. -->
<style>
@font-face{font-family:J;src:url(jakarta-semibold.woff2)}
@font-face{font-family:JR;src:url(jakarta-regular.woff2)}
html,body{margin:0;padding:0;background:#000}
#p{position:relative;overflow:hidden;font-family:J;color:#1A2B4C}
.k{position:absolute;left:0;top:0}
.tel{position:absolute;width:300px;height:649px;border-radius:44px;background:linear-gradient(135deg,#2A3040,#0B0E16 40%,#1C2230);transform-origin:50% 50%}
.tel .e{position:absolute;left:9px;top:9px;right:9px;bottom:9px;border-radius:36px;overflow:hidden;background:#F7F4EE}
.tel .e img{width:100%;display:block}
.tel .a{position:absolute;left:50%;top:17px;width:84px;height:24px;margin-left:-42px;border-radius:12px;background:#05070D}
</style></head><body>
<div id="p"></div>
<script src="veri.js"></script>
<script>
const B = new URLSearchParams(location.search).get("b") || "kart";
const KART = B === "kart", W = KART ? 1920 : 1080, H = KART ? 1080 : 1920;
const $ = (i) => document.getElementById(i);
$("p").style.width = W + "px"; $("p").style.height = H + "px";
const kanat = (renk, w) => `<svg width="${w}" height="${w * 29 / 62}" viewBox="76 117.5 62 29"><path d="${VERI.kanat}" fill="${renk}"/></svg>`;
function desen(op) {
  let s = "";
  for (let r = -1; r < H / 92 + 1; r++) for (let c = -1; c < W / 130 + 1; c++) {
    const x = c * 130 + (r % 2) * 65, y = r * 92;
    s += `<g transform="translate(${x},${y}) rotate(-18) scale(1.25) translate(-107,-132)"><path d="${VERI.kanat}" fill="#FFF"/></g>`;
  }
  return `<svg class="k" width="${W}" height="${H}" style="opacity:${op}">${s}</svg>`;
}
const tel = (ek, x, y, rot, s) => `<div class="tel" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg) scale(${s});box-shadow:0 60px 100px rgba(0,0,0,.5),0 2px 0 1px rgba(255,255,255,.08) inset"><div class="e"><img src="ekran/${ek}.jpg"></div><div class="a"></div></div>`;
// kapaklar: "#001" + soluk "/100"
function kapak(m, x, y, hw, hh, fs, solgun) {
  return `<div style="position:absolute;left:${x}px;top:${y}px;display:flex;gap:${hw * .1}px">` + [...m].map(c =>
    `<div style="position:relative;width:${hw}px;height:${hh}px;border-radius:${hw * .15}px;background:${solgun ? "rgba(255,255,255,.16)" : "rgba(255,255,255,.92)"};box-shadow:0 8px 18px rgba(0,0,0,.25);font-size:${fs}px;line-height:${hh}px;text-align:center;color:${solgun ? "#E2B867" : "#1A2B4C"}">${c}
     <div style="position:absolute;left:0;right:0;top:${hh / 2 - 1}px;height:2px;background:${solgun ? "rgba(255,255,255,.12)" : "rgba(26,43,76,.14)"}"></div></div>`).join("") + `</div>`;
}
// cam pano (lacivert zemin üstünde), içinde KURUCU numarası
function pano(x, y, w, h, s) {
  const hw = 112 * s, hh = 164 * s, fs = 104 * s, ara = hw * .1;
  const w1 = 4 * hw + 3 * ara, w2 = 4 * hw * .62 + 3 * ara * .62;
  const top = w1 + 36 * s + w2, x0 = (w - top) / 2, yy = 160 * s;
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${40 * s}px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.28);box-shadow:0 40px 100px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:blur(18px)">
    <div style="position:absolute;left:${52 * s}px;top:${44 * s}px;display:flex;align-items:center;gap:${16 * s}px">${kanat("#F7F4EE", 62 * s)}<span style="font-size:${26 * s}px;letter-spacing:.46em;color:#F7F4EE">LOUNGELINK</span></div>
    <div style="position:absolute;right:${52 * s}px;top:${50 * s}px;display:flex;align-items:center;gap:${12 * s}px;font-size:${24 * s}px;letter-spacing:.2em;color:#E2B867">
      <span style="width:${14 * s}px;height:${14 * s}px;border-radius:50%;background:#E2B867;box-shadow:0 0 0 ${6 * s}px rgba(226,184,103,.25)"></span>İLK 100</div>
    <div style="position:absolute;left:${52 * s}px;right:${52 * s}px;top:${118 * s}px;height:2px;background:rgba(255,255,255,.18)"></div>
    ${kapak("#001", x0, yy, hw, hh, fs)}
    ${kapak("/100", x0 + w1 + 36 * s, yy + hh * .38, hw * .62, hh * .62, fs * .62, true)}
    <div style="position:absolute;left:0;right:0;top:${yy + hh + 34 * s}px;text-align:center;font-size:${22 * s}px;letter-spacing:.3em;color:rgba(247,244,238,.7)">✦ KALICI ROZET ✦</div></div>`;
}
const zemin = `<div class="k" style="width:${W}px;height:${H}px;background:linear-gradient(160deg,#2C4374,#1A2B4C 60%,#121E38)"></div>` + desen(.06);
const hale = (x, y, r, a) => `<div class="k" style="left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;background:radial-gradient(circle, rgba(226,184,103,${a}), transparent 65%)"></div>`;
if (KART) {
  // sol alt ~900x420 boş (Apple etkinlik adı + kısa açıklama + rozet buraya biner)
  $("p").innerHTML = zemin + hale(1380, 430, 620, .28) +
    tel("71_akis_nehir_istek", 700, 130, -7, 1.18) +
    pano(1090, 300, 740, 400, 0.84);
} else {
  // alt ~%35 Apple metnine bırakılır; ana içerik üstte
  $("p").innerHTML = zemin + hale(540, 640, 560, .3) +
    pano(90, 340, 900, 450, 1) +
    tel("71_akis_nehir_istek", 390, 1000, 4, 1.3) +
    `<div class="k" style="width:${W}px;top:${H - 760}px;height:760px;background:linear-gradient(180deg,rgba(18,30,56,0),rgba(18,30,56,.85) 55%,#121E38)"></div>`;
}
</script>
</body></html>
